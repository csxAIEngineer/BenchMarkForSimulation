[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popbench"
version = "0.3.0"
description = "Basic-info persona cards, CR API pricing simulation, and held-out evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.26",
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/popbench"]

[tool.hatch.build.targets.wheel.force-include]
"cr_api" = "cr_api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
