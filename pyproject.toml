[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popbench"
version = "0.2.0"
description = "Three-layer benchmark for LLM population simulation: datasets, persona methods, and LLM communication."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.26",
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "python-dotenv>=1.0"]

[project.scripts]
popbench = "popbench.cli:main"
benchmark = "popbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/popbench"]

[tool.hatch.build.targets.wheel.force-include]
"cr_api" = "cr_api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
