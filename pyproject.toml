[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popbench"
version = "0.1.0"
description = "Score LLM simulations of population sentiment and decisions against Twin-2K-500."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.26",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
popbench = "popbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
